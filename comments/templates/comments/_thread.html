<div class="comment-thread flow">
    <h2>Comments</h2>
    <div id="comment-list" class="flow">
        {% for comment in comments %}
        {% include "comments/_comment_card.html" %}
        {% empty %}
        <p id="comment-list-empty">No comments yet.</p>
        {% endfor %}
    </div>

    <div class="flow">
        <h3>New comment</h3>
        {% include "comments/_comment_form.html" with form=comment_form parent_id=None %}
    </div>
</div>
