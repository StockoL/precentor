{% extends "base.html" %}
{% block title %}Scores — Precentor{% endblock %}
{% block content %}
<h1>Scores</h1>
<a href="{% url 'library:score_create' %}">Add a score</a>
<ul>
    {% for score in scores %}
    <li><a href="{{ score.get_absolute_url }}">{{ score }}</a></li>
    {% empty %}
    <li>No scores yet.</li>
    {% endfor %}
</ul>
{% endblock %}
