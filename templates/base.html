<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Precentor{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'src/global/layers.css' %}">
    <link rel="stylesheet" href="{% static 'src/global/variables.css' %}">
    <link rel="stylesheet" href="{% static 'src/global/reset.css' %}">
    <link rel="stylesheet" href="{% static 'src/global/global-styles.css' %}">
    <link rel="stylesheet" href="{% static 'src/compositions/center.css' %}">
    <link rel="stylesheet" href="{% static 'src/compositions/cluster.css' %}">
    <link rel="stylesheet" href="{% static 'src/compositions/flow.css' %}">
    <link rel="stylesheet" href="{% static 'src/compositions/grid.css' %}">
    <link rel="stylesheet" href="{% static 'src/compositions/reel.css' %}">
    <link rel="stylesheet" href="{% static 'src/compositions/sidebar.css' %}">
    <link rel="stylesheet" href="{% static 'src/compositions/switcher.css' %}">
    <link rel="stylesheet" href="{% static 'src/compositions/wrapper.css' %}">
    <link rel="stylesheet" href="{% static 'src/compositions/cover.css' %}">
    <link rel="stylesheet" href="{% static 'src/blocks/badge.css' %}">
    <link rel="stylesheet" href="{% static 'src/blocks/comment-card.css' %}">
    <link rel="stylesheet" href="{% static 'src/blocks/form.css' %}">
    <link rel="stylesheet" href="{% static 'src/blocks/button.css' %}">
    <link rel="stylesheet" href="{% static 'src/blocks/nav.css' %}">
    <link rel="stylesheet" href="{% static 'src/blocks/role-block.css' %}">
    <link rel="stylesheet" href="{% static 'src/blocks/term-summary.css' %}">
    <link rel="stylesheet" href="{% static 'src/utilities/utilities.css' %}">
</head>
<body>
    <header class="wrapper">
        <nav class="site-nav cluster" style="--cluster-justify: space-between;">
            <a href="{% url 'planning:term_list' %}">Precentor</a>
            <div class="cluster" style="--gutter: var(--spacing-s);">
                <a href="{% url 'planning:term_list' %}">Terms</a>
                <a href="{% url 'library:score_list' %}">Score Library</a>
                <a href="{% url 'comments:inbox' %}">Inbox</a>
                {% if user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Log out</button>
                </form>
                {% else %}
                <a href="{% url 'login' %}">Log in</a>
                {% endif %}
            </div>
        </nav>
    </header>
    <main class="wrapper">
        {% if messages %}
        <ul role="list" class="flow">
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
