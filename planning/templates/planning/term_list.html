{% extends "base.html" %}
{% block title %}Terms — Precentor{% endblock %}
{% block content %}
<h1>Terms</h1>
<a href="{% url 'planning:term_create' %}">Add a term</a>
<ul>
    {% for term in terms %}
    <li><a href="{{ term.get_absolute_url }}">{{ term }}</a> — {{ term.start_date|date:"d/m/Y" }} to {{ term.end_date|date:"d/m/Y" }}</li>
    {% empty %}
    <li>No terms yet.</li>
    {% endfor %}
</ul>
{% endblock %}
