{% extends "base.html" %}
{% block title %}Delete service — Precentor{% endblock %}
{% block content %}
<h1>Delete "{{ service }}"?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
</form>
<a href="{{ service.get_absolute_url }}">Cancel</a>
{% endblock %}
