{% extends "base.html" %}
{% block title %}Delete term — Precentor{% endblock %}
{% block content %}
<div class="flow">
    <h1>Delete "{{ term }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>
    <a href="{{ term.get_absolute_url }}">Cancel</a>
</div>
{% endblock %}
