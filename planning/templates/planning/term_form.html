{% extends "base.html" %}
{% block title %}{% if form.instance.pk %}Edit term{% else %}New term{% endif %} — Precentor{% endblock %}
{% block content %}
<div class="flow">
    <h1>{% if form.instance.pk %}Edit term{% else %}New term{% endif %}</h1>
    <form method="post" class="flow">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
</div>
{% endblock %}
