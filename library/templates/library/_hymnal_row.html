<li class="list-row list-row--wrap">
    <div class="flow" style="--flow-space: var(--spacing-3xs);">
        <p>{{ hymnal.name }} <span class="badge badge--code">{{ hymnal.short_name }}</span></p>
        <p class="list-row__meta">{{ hymnal.copies_owned }} cop{{ hymnal.copies_owned|pluralize:"y,ies" }}{% if hymnal.filing_location %} · {{ hymnal.filing_location }}{% endif %}</p>
    </div>
    {% if can.edit_library %}
    <div class="cluster">
        <a class="btn-ghost" href="{% url 'library:hymnal_update' hymnal.pk %}">Edit<span class="visually-hidden"> {{ hymnal.name }}</span></a>
        <a class="btn-danger" href="{% url 'library:hymnal_delete' hymnal.pk %}">Delete<span class="visually-hidden"> {{ hymnal.name }}</span></a>
    </div>
    {% endif %}
</li>
