{% extends "base.html" %}
{% block title %}Delete score — Precentor{% endblock %}
{% block content %}
<div class="flow">
    <h1>Delete "{{ score }}"?</h1>
    <div class="cluster">
        <form method="post">
            {% csrf_token %}
            <button class="text-danger" type="submit">Yes, delete</button>
        </form>
        <a href="{{ score.get_absolute_url }}">Cancel</a>
    </div>
</div>
{% endblock %}
