{% extends "base.html" %}
{% block title %}{{ score }} — Precentor{% endblock %}
{% block content %}
<h1>{{ score }}</h1>
<p>Voicing: {{ score.voicing }}</p>
<p>Language: {{ score.language }}</p>
<p>Copies owned: {{ score.copies_owned }}</p>
<a href="{% url 'library:score_update' score.pk %}">Edit</a>
<a href="{% url 'library:score_delete' score.pk %}">Delete</a>
{% endblock %}
