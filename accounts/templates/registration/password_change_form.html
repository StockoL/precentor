{% extends "base.html" %}
{% block title %}Change your password — Precentor{% endblock %}
{% block content %}
<div class="flow">
    <h1>Change your password</h1>
    <form method="post" class="flow">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn-primary" type="submit">Save password</button>
    </form>
    <p class="list-row__meta">Leaving? <a href="{% url 'delete_account' %}">Delete your account</a>.</p>
</div>
{% endblock %}
